services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql-lens-backend
    ports:
      - "8088:8080"
    restart: unless-stopped
    networks:
      - sql-lens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sql-lens-frontend
    ports:
      - "3008:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sql-lens-network

networks:
  sql-lens-network:
    driver: bridge
